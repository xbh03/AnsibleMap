[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansiblemap"
version = "0.2.4"
description = "Scans repositories for Ansible assets and stores dependency maps in PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Francesco Zoino" }]
dependencies = [
  "typer==0.12.5",
  "httpx==0.27.2",
  "SQLAlchemy==2.0.36",
  "psycopg[binary]==3.2.13",
  "PyYAML==6.0.2",
  "tenacity==9.0.0",
]

[project.scripts]
ansiblemap = "ansiblemap.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
